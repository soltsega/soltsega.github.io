<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Copy Code Button Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("pre.highlight, div.highlighter-rouge pre").forEach((block) => {
        // Only add button if the parent is relatively positioned (or make it relative)
        let wrapper = block.parentNode;
        if (wrapper.tagName !== "DIV" || !wrapper.classList.contains("highlight")) {
          wrapper = block; 
        }
        
        wrapper.style.position = "relative";
        
        const button = document.createElement("button");
        button.className = "copy-code-btn";
        button.innerText = "Copy";

        button.addEventListener("click", () => {
          const code = block.querySelector("code") ? block.querySelector("code").innerText : block.innerText;
          navigator.clipboard.writeText(code).then(() => {
            button.innerText = "Copied!";
            button.classList.add("copied");
            setTimeout(() => {
              button.innerText = "Copy";
              button.classList.remove("copied");
            }, 2000);
          });
        });

        wrapper.appendChild(button);
      });
    });
  </script>
</head>
